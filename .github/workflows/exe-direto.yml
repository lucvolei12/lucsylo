name: Publicar EXE direto
on:
  push:
    paths:
      - .github/workflows/exe-direto.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Extrair e conferir o executável
        run: |
          curl --fail --location --retry 3 -o pacote.zip https://github.com/lucvolei12/lucsylo/releases/download/v0.1.0/Lucsylo-Windows.zip
          unzip -j pacote.zip Lucsylo.exe
          echo "a2f5d8d19a96ce267deccf9196c01876e76681c53f0d0679704551104e330d8b  Lucsylo.exe" | sha256sum -c -
      - name: Publicar executável no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 Lucsylo.exe --repo lucvolei12/lucsylo --clobber
