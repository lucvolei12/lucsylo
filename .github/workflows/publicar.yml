name: Publicar Lucsylo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar e verificar pacote
        run: |
          python3 - <<PY
          import urllib.request, re, hashlib
          page = urllib.request.urlopen("https://www.tempsend.com/hzfjhueu").read().decode()
          match = re.search(r"href=\"(https://www\.tempsend\.com/[^\"]+/Lucsylo-Windows\.zip)\"", page)
          if not match:
              raise RuntimeError("Link de download não encontrado")
          urllib.request.urlretrieve(match.group(1), "Lucsylo-Windows.zip")
          with open("Lucsylo-Windows.zip", "rb") as f:
              digest = hashlib.file_digest(f, "sha256").hexdigest()
          assert digest == "266818ebed20a6f678466a2f196c3ee21cc60660d50b87474667dff0906f99e3", "Arquivo não confere"
          PY
      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 Lucsylo-Windows.zip --title "Lucsylo 0.1.0" --notes "Versão inicial para Windows 10 e 11 de 64 bits. Aplicativo ainda não testado em Windows e sem assinatura digital."
          fi
