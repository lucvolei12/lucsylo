name: Publicar Lucsylo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar e verificar pacote
        run: |
          python3 - <<'PY'
          import urllib.request, re, hashlib, sys
          stage = 'abrir pagina temporaria'
          try:
              req = urllib.request.Request('https://www.tempsend.com/hzfjhueu', headers={'User-Agent': 'Mozilla/5.0'})
              page = urllib.request.urlopen(req, timeout=60).read().decode()
              match = re.search(r'href="(https://www\.tempsend\.com/[^"]+/Lucsylo-Windows\.zip)"', page)
              if not match: raise ValueError('link nao encontrado')
              stage = 'baixar arquivo'
              req = urllib.request.Request(match.group(1), headers={'User-Agent': 'Mozilla/5.0', 'Referer': 'https://www.tempsend.com/hzfjhueu'})
              h = hashlib.sha256()
              with urllib.request.urlopen(req, timeout=180) as response, open('Lucsylo-Windows.zip','wb') as f:
                  while True:
                      b = response.read(1048576)
                      if not b: break
                      f.write(b); h.update(b)
              stage = 'verificar hash'
              if h.hexdigest() != '266818ebed20a6f678466a2f196c3ee21cc60660d50b87474667dff0906f99e3': raise ValueError('hash divergente')
          except Exception as e:
              print('::error::Etapa ' + stage + ' falhou: ' + type(e).__name__ + ' status ' + str(getattr(e,'code','nao disponivel')))
              sys.exit(1)
          PY
      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 Lucsylo-Windows.zip --title "Lucsylo 0.1.0" --notes "Versão inicial para Windows 10 e 11 de 64 bits. Aplicativo ainda não testado em Windows e sem assinatura digital."
          fi
