name: Atualizar download do site
on:
  push:
    paths:
      - .github/workflows/atualizar-download.yml
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar site
        run: |
          python3 -c "from pathlib import Path; p=Path(\"index.html\"); s=p.read_text(); s=s.replace(\"Lucsylo-Windows.zip\", \"Lucsylo.exe\").replace(\"Baixe o pacote, descompacte e abra o Lucsylo.exe.\", \"Baixe e abra o Lucsylo.exe diretamente, sem descompactar.\").replace(\"Pacote ZIP com o aplicativo e instruções.\", \"Executável para download direto.\"); import re; s=re.sub(\"Toque em Baixar Lucsylo para abrir a página do pacote.*?O Windows pode mostrar um aviso porque o aplicativo não é assinado.\", \"Baixe o executável pelo GitHub. O Windows pode mostrar um aviso porque o aplicativo não é assinado.\", s); p.write_text(s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualizar site para download direto"
          git push
